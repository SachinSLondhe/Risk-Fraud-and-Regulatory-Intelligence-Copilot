name: REGINTEL_SEMANTIC_VIEW
tables:
  - name: ALERTS
    base_table:
      database: REGINTEL
      schema: RISK
      table: ALERTS
    description: "Risk alerts generated by deterministic SQL rules. Each alert links to an account, customer, and triggering rule."
    dimensions:
      - name: ALERT_ID
        expr: ALERT_ID
        description: "Unique alert identifier"
        unique: true
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        description: "Account that triggered the alert"
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        description: "Customer associated with the alert"
      - name: RULE_ID
        expr: RULE_ID
        description: "Risk rule that triggered this alert (e.g. AML_001, FRD_001)"
      - name: SEVERITY
        expr: SEVERITY
        description: "Alert severity: HIGH, MEDIUM, LOW"
      - name: ALERT_STATUS
        expr: ALERT_STATUS
        description: "Current status: NEW, UNDER_REVIEW, ESCALATED, CLOSED_TRUE_POS, CLOSED_FALSE_POS"
      - name: EXPLANATION
        expr: EXPLANATION
        description: "Human-readable explanation of why the alert was triggered, including observed values and thresholds"
      - name: PRIMARY_TRANSACTION_ID
        expr: PRIMARY_TRANSACTION_ID
        description: "Primary transaction that triggered this alert"
    time_dimensions:
      - name: ALERT_TIMESTAMP
        expr: ALERT_TIMESTAMP
        description: "When the alert was generated"
        data_type: TIMESTAMP_NTZ
    measures:
      - name: RISK_SCORE
        expr: RISK_SCORE
        description: "Deterministic risk score (0-100) calculated by SQL rules"
        default_aggregation: avg
      - name: ALERT_COUNT
        expr: "1"
        description: "Count of alerts"
        default_aggregation: sum

  - name: RISK_RULES
    base_table:
      database: REGINTEL
      schema: RISK
      table: RISK_RULES
    description: "Versioned risk rules with configurable thresholds. Covers AML, FRAUD, CREDIT, LIQUIDITY domains."
    dimensions:
      - name: RULE_ID
        expr: RULE_ID
        description: "Rule identifier (e.g. AML_001, FRD_001, CRD_001, LIQ_001)"
        unique: true
      - name: RULE_NAME
        expr: RULE_NAME
        description: "Human-readable rule name"
      - name: RISK_DOMAIN
        expr: RISK_DOMAIN
        description: "Risk domain: AML, FRAUD, CREDIT, LIQUIDITY"
      - name: SEVERITY
        expr: SEVERITY
        description: "Default rule severity"
      - name: RULE_DESCRIPTION
        expr: RULE_DESCRIPTION
        description: "Description of what this rule detects"
      - name: POLICY_REFERENCE
        expr: POLICY_REFERENCE
        description: "Reference to the policy section governing this rule"

  - name: CUSTOMERS
    base_table:
      database: REGINTEL
      schema: CURATED
      table: V_CUSTOMERS
    description: "Curated customer view with synthetic banking customer profiles."
    dimensions:
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        description: "Unique customer identifier"
        unique: true
      - name: CUSTOMER_TYPE
        expr: CUSTOMER_TYPE
        description: "Customer type: INDIVIDUAL, CORPORATE, NBFC_BORROWER"
      - name: RISK_RATING
        expr: RISK_RATING
        description: "Customer risk rating: LOW, MEDIUM, HIGH"
      - name: KYC_STATUS
        expr: KYC_STATUS
        description: "KYC verification status: VERIFIED, PENDING, EXPIRED"
      - name: COUNTRY_CODE
        expr: COUNTRY_CODE
        description: "Customer home country code"
      - name: IS_PEP
        expr: IS_PEP
        description: "Whether customer is a Politically Exposed Person"
    measures:
      - name: EXPECTED_MONTHLY_TURNOVER
        expr: EXPECTED_MONTHLY_TURNOVER
        description: "Expected monthly turnover declared by customer"
        default_aggregation: avg

  - name: ACCOUNTS
    base_table:
      database: REGINTEL
      schema: CURATED
      table: V_ACCOUNTS
    description: "Curated account view with synthetic bank accounts."
    dimensions:
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        description: "Unique account identifier"
        unique: true
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        description: "Customer who owns this account"
      - name: ACCOUNT_TYPE
        expr: ACCOUNT_TYPE
        description: "Account type: SAVINGS, CURRENT, CREDIT, LOAN"
      - name: ACCOUNT_STATUS
        expr: ACCOUNT_STATUS
        description: "Account status: ACTIVE, DORMANT, CLOSED, FROZEN"
    measures:
      - name: CURRENT_BALANCE
        expr: CURRENT_BALANCE
        description: "Current account balance"
        default_aggregation: sum
      - name: CREDIT_LIMIT
        expr: CREDIT_LIMIT
        description: "Credit limit for CREDIT accounts"
        default_aggregation: sum

  - name: TRANSACTIONS
    base_table:
      database: REGINTEL
      schema: CURATED
      table: V_TRANSACTIONS
    description: "Curated transaction view with synthetic banking transactions. Device/IP tokens excluded."
    dimensions:
      - name: TRANSACTION_ID
        expr: TRANSACTION_ID
        description: "Unique transaction identifier"
        unique: true
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        description: "Account for this transaction"
      - name: COUNTERPARTY_ACCOUNT_ID
        expr: COUNTERPARTY_ACCOUNT_ID
        description: "Counterparty account if applicable"
      - name: TRANSACTION_TYPE
        expr: TRANSACTION_TYPE
        description: "Transaction type: CREDIT, DEBIT, TRANSFER_IN, TRANSFER_OUT"
      - name: CHANNEL
        expr: CHANNEL
        description: "Transaction channel: BRANCH, ATM, ONLINE, MOBILE, WIRE"
      - name: ORIGIN_COUNTRY_CODE
        expr: ORIGIN_COUNTRY_CODE
        description: "Country where transaction originated"
      - name: DESTINATION_COUNTRY_CODE
        expr: DESTINATION_COUNTRY_CODE
        description: "Destination country for the transaction"
    time_dimensions:
      - name: TRANSACTION_TIMESTAMP
        expr: TRANSACTION_TIMESTAMP
        description: "When the transaction occurred"
        data_type: TIMESTAMP_NTZ
    measures:
      - name: AMOUNT
        expr: AMOUNT
        description: "Transaction amount in INR"
        default_aggregation: sum
      - name: TRANSACTION_COUNT
        expr: "1"
        description: "Count of transactions"
        default_aggregation: sum

  - name: CASES
    base_table:
      database: REGINTEL
      schema: CASE_MGMT
      table: CASES
    description: "Investigation cases linked to alerts. Tracks case lifecycle from NEW to APPROVED/REJECTED."
    dimensions:
      - name: CASE_ID
        expr: CASE_ID
        description: "Unique case identifier"
        unique: true
      - name: ALERT_ID
        expr: ALERT_ID
        description: "Alert that initiated this case"
      - name: CASE_STATUS
        expr: CASE_STATUS
        description: "Case status: NEW, INVESTIGATING, DRAFT_FINDING, REVIEW_REQUIRED, APPROVED, REJECTED, CLOSED"
      - name: CREATED_BY
        expr: CREATED_BY
        description: "User who created the case"
      - name: DISPOSITION
        expr: DISPOSITION
        description: "Final case disposition"
    time_dimensions:
      - name: CREATED_AT
        expr: CREATED_AT
        description: "When the case was created"
        data_type: TIMESTAMP_NTZ

  - name: DAILY_BALANCE
    base_table:
      database: REGINTEL
      schema: CURATED
      table: V_DAILY_BALANCE
    description: "Daily balance snapshots for liquidity analysis. Used by LIQ_001 rule."
    dimensions:
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        description: "Account identifier"
    time_dimensions:
      - name: BALANCE_DATE
        expr: BALANCE_DATE
        description: "Balance snapshot date"
        data_type: DATE
    measures:
      - name: CLOSING_BALANCE
        expr: CLOSING_BALANCE
        description: "End of day closing balance"
        default_aggregation: avg
      - name: AVAILABLE_LIQUIDITY
        expr: AVAILABLE_LIQUIDITY
        description: "Available liquidity including credit limits"
        default_aggregation: avg
      - name: TOTAL_CREDITS
        expr: TOTAL_CREDITS
        description: "Total credits for the day"
        default_aggregation: sum
      - name: TOTAL_DEBITS
        expr: TOTAL_DEBITS
        description: "Total debits for the day"
        default_aggregation: sum

relationships:
  - name: ALERTS_TO_RULES
    left_table: ALERTS
    right_table: RISK_RULES
    relationship_columns:
      - left_column: RULE_ID
        right_column: RULE_ID
    join_type: inner
    relationship_type: many_to_one
  - name: ALERTS_TO_ACCOUNTS
    left_table: ALERTS
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
    join_type: inner
    relationship_type: many_to_one
  - name: ALERTS_TO_CUSTOMERS
    left_table: ALERTS
    right_table: CUSTOMERS
    relationship_columns:
      - left_column: CUSTOMER_ID
        right_column: CUSTOMER_ID
    join_type: inner
    relationship_type: many_to_one
  - name: ACCOUNTS_TO_CUSTOMERS
    left_table: ACCOUNTS
    right_table: CUSTOMERS
    relationship_columns:
      - left_column: CUSTOMER_ID
        right_column: CUSTOMER_ID
    join_type: inner
    relationship_type: many_to_one
  - name: TRANSACTIONS_TO_ACCOUNTS
    left_table: TRANSACTIONS
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
    join_type: inner
    relationship_type: many_to_one
  - name: CASES_TO_ALERTS
    left_table: CASES
    right_table: ALERTS
    relationship_columns:
      - left_column: ALERT_ID
        right_column: ALERT_ID
    join_type: inner
    relationship_type: many_to_one
  - name: DAILY_BALANCE_TO_ACCOUNTS
    left_table: DAILY_BALANCE
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
    join_type: inner
    relationship_type: many_to_one
